[package]
name = "subs2srs-core"
description = "Subtitle parsing, line matching and ffmpeg media generation for subs2srs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[[bin]]
name = "subs2srs-cli"
path = "src/bin/cli.rs"
