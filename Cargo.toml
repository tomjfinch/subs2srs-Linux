[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[package]
name = "subs2srs"
description = "Create Anki flashcards from video and subtitles (GTK4 port of subs2srs)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
subs2srs-core = { path = "crates/core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
serde = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
